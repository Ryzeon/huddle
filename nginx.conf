server {
  listen 80;
  root /usr/share/nginx/html;

  # El portal lee su sala de la query string, así que no hay rutas que
  # reescribir: cualquier ruta desconocida es un error de verdad.
  location / {
    try_files $uri $uri/ =404;
  }

  # Los .js compilados llevan el nombre sin huella, así que no se cachean
  # fuerte: un despliegue nuevo debe verse sin vaciar el navegador.
  location ~* \.(js|css|map)$ {
    add_header Cache-Control "no-cache";
  }
}
